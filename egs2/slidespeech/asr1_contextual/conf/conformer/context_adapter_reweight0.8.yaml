model: contextual_asr_espnet

# network architecture
# encoder related
encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

# decoder related
decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1

# hybrid CTC/attention
model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1     # label smoothing option
    length_normalized_loss: false

frontend_conf:
    n_fft: 512
    win_length: 400
    hop_length: 160

seed: 2022
log_interval: 100
num_att_plot: 0
num_workers: 0
sort_in_batch: descending       # how to sort data in making batch
sort_batch: descending          # how to sort created batches
batch_type: numel
batch_bins: 56000000
# batch_bins: 12000000
accum_grad: 1
max_epoch: 100
val_scheduler_criterion:
    - valid
    - acc
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 10

use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false
optim: adam
grad_clip: 1
optim_conf:
   lr: 0.0005
#    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
   warmup_steps: 35000

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 5

# contextual information settings
contextual: context_sampler
contextual_conf:
    contextual_type: context_sampler
    # metadata for context list
    context_list_path: ./local/contextual/contexts/context_f65536_train.txt
    context_phone_embedding_path: null
    context_list_occurrence_path: ./local/contextual/contexts/context_f65536_train_occurrence_train.txt
    # context settings
    use_no_context_token: true
    lower_context_word: false
    # sampling settings
    gold_context_dropout: 0.0
    sub_context_list_dropout: 0.0
    max_utterance_disrupt_context: 10
    max_batch_disrupt_context: 500
    shuffle_sub_context_list: False
    # hard negative context settings
    hnc_sampler_type: null
    hnc_per_gold_context: 1
    hnc_dropout: 0.3
    hnc_hardness_range: 10
    hnc_use_gpu: false
    # nlp prompt setting
    use_context_prompt: False
    # special structure type
    sub_context_list_structure_type: null

# contextualizer settings
contextualizer: contextual_adapter_encoder
contextualizer_conf:
    contextualizer_type: contextual_adapter_encoder
    context_embed_size: 256
    context_hidden_size: 256
    model_hidden_size: 256
    attndim: 256
    proj_hidden_size: 256
    drop_out: 0.1
    num_blocks: 2
    linear_units: 256
    context_attention_heads: 1
    adapter_attention_heads: 1
    atten_temperature: 1.0
    use_local_attn_conv: False
    # contextualizer loss settings
    warmup_epoch: 0
    embed_share_weight_ctc: false
    contextualizer_weight: 0.5
    contextualizer_losses:
        loss_contextualizer_ga_ctc: [0.5, "encoder"]
        loss_contextualizer_ga_reweight_lp: [0.5, "encoder"]
    lp_gamma: 0.8

# adapter style training
freeze_param: ["encoder", "decoder", "contextualizer.encoder.embed", "contextualizer.encoder.pad_embed"]